name: QuantumGuard QDS CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'dhruv-patil/**'
      - 'yash-chobe/**'
      - 'yash-kharat/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Unit & Integration Tests (PostgreSQL + Redis)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quantumguard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev gcc

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/quantumguard
        run: |
          alembic upgrade head

      - name: Test Core Quantum Engine (D1)
        run: |
          python tests/test_core.py

      - name: Test Adversarial Attack Simulator (D2 & D3)
        run: |
          python tests/test_attacks.py

      - name: Test Database Models & Persistent Ledger (D5)
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/quantumguard
        run: |
          python tests/test_db.py

      - name: Test Redis Atomic Invalidation & Anti-Replay
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          python tests/test_redis.py

      - name: Test FastAPI REST Gateway
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/quantumguard
          REDIS_URL: redis://localhost:6379/0
        run: |
          python tests/test_api.py

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: false
          tags: quantumguard/backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          tags: quantumguard/frontend:test
